name: Bot sự kiện miền Nam

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      action:
        description: "Lệnh muốn chạy thủ công"
        type: choice
        default: tick
        options: [tick, collect, "digest --force", check-sources, test-send, get-chat-id]

concurrency:
  group: mn-events-db
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Luôn lấy commit MỚI NHẤT lúc job bắt đầu chạy (không phải commit lúc job được xếp hàng),
      # để thấy được CSDL mà lượt trước vừa lưu -> tránh gửi bản tin 2 lần.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests feedparser beautifulsoup4 PyYAML openpyxl tzdata

      - name: Cài bộ giải mã link Google News
        run: pip install googlenewsdecoder

      - name: Chạy bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
          ADMIN_CHAT_IDS: ${{ secrets.ADMIN_CHAT_IDS }}
          BOT_JOIN_CODE: ${{ secrets.BOT_JOIN_CODE }}
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          MAX_ARTICLE_FETCH: "120"
        run: |
          ACTION="${{ github.event.inputs.action }}"
          if [ -z "$ACTION" ] || [ "$ACTION" = "tick" ]; then
            timeout -s INT 285 python main.py serve || true
          else
            python main.py $ACTION
          fi

      - name: Lưu CSDL về repo
        if: always()
        run: |
          git config user.name "mn-events-bot"
          git config user.email "mn-events-bot@users.noreply.github.com"
          git add -f data/events.db
          if git diff --cached --quiet; then
            echo "CSDL không đổi."
            exit 0
          fi
          git commit -m "data: cập nhật $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          for i in 1 2 3; do
            git pull --rebase -X theirs && git push && exit 0
            echo "Push lần $i thất bại, thử lại..."
            sleep 5
          done
          echo "::error::Không lưu được CSDL lên repo"
          exit 1
